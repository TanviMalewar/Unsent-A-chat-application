<!-- src/public/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Real-time Chat Test</title>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        .container { border: 1px solid #ddd; border-radius: 10px; padding: 20px; }
        .messages { height: 400px; overflow-y: auto; border: 1px solid #eee; padding: 10px; margin: 10px 0; }
        .message { margin: 5px 0; padding: 8px; background: #f0f0f0; border-radius: 5px; }
        .message.own { background: #007bff; color: white; margin-left: 20%; }
        .input-area { display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 10px; }
        .input-area button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .controls { margin: 10px 0; display: flex; gap: 10px; flex-wrap: wrap; }
        .controls input { flex: 1; padding: 8px; }
        .controls button { padding: 8px 15px; border: none; cursor: pointer; }
        .btn-join { background: #28a745; color: white; }
        .btn-leave { background: #dc3545; color: white; }
        .btn-connect { background: #17a2b8; color: white; }
        .btn-disconnect { background: #6c757d; color: white; }
        .status { padding: 5px 10px; border-radius: 5px; display: inline-block; }
        .online { background: #d4edda; color: #155724; }
        .offline { background: #f8d7da; color: #721c24; }
        .info { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .info.success { background: #d4edda; color: #155724; }
        .info.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chat Test</h1>
        <div>
            Status: <span id="status" class="status offline">Offline</span>
        </div>
        <div id="info" class="info success" style="display:none;"></div>

        <div class="controls">
            <input type="text" id="roomInput" placeholder="Room ID" value="room1">
            <button class="btn-connect" onclick="connect()">Connect</button>
            <button class="btn-disconnect" onclick="disconnect()">Disconnect</button>
            <button class="btn-join" onclick="joinRoom()">Join Room</button>
            <button class="btn-leave" onclick="leaveRoom()">Leave Room</button>
        </div>

        <div class="messages" id="messages">
            <div style="text-align:center; color:#999; padding:20px;">Connect and join a room to start chatting</div>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type a message..." disabled>
            <button onclick="sendMessage()" id="sendBtn" disabled>Send</button>
        </div>
    </div>

    <script>
        let socket = null;
        let currentRoom = null;
        const messagesDiv = document.getElementById('messages');
        const statusSpan = document.getElementById('status');
        const infoDiv = document.getElementById('info');
        const roomInput = document.getElementById('roomInput');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        function showInfo(message, type = 'success') {
            infoDiv.textContent = message;
            infoDiv.className = 'info ' + type;
            infoDiv.style.display = 'block';
            setTimeout(() => { infoDiv.style.display = 'none'; }, 3000);
        }

        function updateStatus(connected) {
            statusSpan.textContent = connected ? 'Online' : 'Offline';
            statusSpan.className = 'status ' + (connected ? 'online' : 'offline');
            const canChat = connected && currentRoom;
            messageInput.disabled = !canChat;
            sendBtn.disabled = !canChat;
            messageInput.placeholder = canChat ? 'Type a message...' : (connected ? 'Join a room' : 'Connect first');
        }

        function addMessage(message, isOwn = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message' + (isOwn ? ' own' : '');
            const sender = document.createElement('div');
            sender.style.fontWeight = 'bold';
            sender.style.fontSize = '12px';
            sender.textContent = isOwn ? 'You' : (message.sender?.username || 'Anonymous');
            const content = document.createElement('div');
            content.textContent = message.content;
            const time = document.createElement('div');
            time.style.fontSize = '10px';
            time.style.color = '#999';
            time.textContent = new Date(message.createdAt).toLocaleTimeString();
            
            msgDiv.appendChild(sender);
            msgDiv.appendChild(content);
            msgDiv.appendChild(time);
            
            // Remove placeholder
            const placeholder = messagesDiv.querySelector('div[style]');
            if (placeholder && placeholder.style.textAlign === 'center') {
                messagesDiv.innerHTML = '';
            }
            
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function connect() {
            if (socket && socket.connected) {
                showInfo('Already connected!');
                return;
            }

            showInfo('Connecting...');
            socket = io(window.location.origin, {
                transports: ['websocket', 'polling']
            });

            socket.on('connect', () => {
                console.log('Connected!', socket.id);
                updateStatus(true);
                showInfo('Connected!');
                const roomId = roomInput.value.trim();
                if (roomId) setTimeout(() => joinRoom(), 500);
            });

            socket.on('disconnect', () => {
                console.log('Disconnected');
                updateStatus(false);
                currentRoom = null;
                showInfo('Disconnected', 'error');
            });

            socket.on('connect_error', (error) => {
                console.error('Connection error:', error);
                showInfo('Connection error: ' + error.message, 'error');
                updateStatus(false);
            });

            socket.on('roomHistory', ({ roomId, messages }) => {
                messagesDiv.innerHTML = '';
                messages.forEach(msg => addMessage(msg));
                showInfo(`Loaded ${messages.length} messages`);
            });

            socket.on('newMessage', ({ message, roomId }) => {
                if (roomId === currentRoom) {
                    const isOwn = message.sender?._id === socket.id;
                    addMessage(message, isOwn);
                }
            });

            socket.on('userJoined', ({ message }) => {
                showInfo(message);
            });

            socket.on('userLeft', ({ message }) => {
                showInfo(message);
            });

            socket.on('error', ({ message }) => {
                showInfo('Error: ' + message, 'error');
            });
        }

        function disconnect() {
            if (socket) {
                if (currentRoom) leaveRoom();
                socket.disconnect();
                socket = null;
                updateStatus(false);
                currentRoom = null;
                messagesDiv.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">Disconnected</div>';
                showInfo('Disconnected');
            }
        }

        function joinRoom() {
            const roomId = roomInput.value.trim();
            if (!roomId) {
                showInfo('Enter a room ID', 'error');
                return;
            }
            if (!socket || !socket.connected) {
                showInfo('Connect first', 'error');
                return;
            }

            if (currentRoom) leaveRoom();
            currentRoom = roomId;
            socket.emit('joinRoom', { roomId });
            showInfo(`Joined room: ${roomId}`);
            updateStatus(true);
            messageInput.focus();
        }

        function leaveRoom() {
            if (socket && currentRoom) {
                socket.emit('leaveRoom', { roomId: currentRoom });
                showInfo(`Left room: ${currentRoom}`);
                currentRoom = null;
                messagesDiv.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">Left room</div>';
                updateStatus(true);
            }
        }

        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content) return;
            if (!socket || !socket.connected) {
                showInfo('Not connected', 'error');
                return;
            }
            if (!currentRoom) {
                showInfo('Join a room first', 'error');
                return;
            }

            socket.emit('sendMessage', { roomId: currentRoom, content });
            messageInput.value = '';
            messageInput.focus();
        }

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Auto-connect
        window.onload = () => {
            setTimeout(connect, 500);
        };
    </script>
</body>
</html>
