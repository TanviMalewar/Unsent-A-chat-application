<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/chat.css">
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div>
                    <h2>Chats</h2>
                    <span id="userBadge" class="user-badge"></span>
                </div>
                <button id="logoutBtn" class="btn btn-outline btn-sm">Logout</button>
            </div>
            <div class="room-list" id="roomList">
                <div class="loading-text">Loading rooms...</div>
            </div>
            <div class="sidebar-footer">
                <button id="createRoomBtn" class="btn btn-primary btn-full">+ New Room</button>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-area">
            <div class="chat-header">
                <div>
                    <h3 id="chatRoomName">Select a room</h3>
                    <span id="chatRoomUsers" class="chat-users">0 online</span>
                </div>
                <div id="onlineUsersList" class="online-users-list"></div>
            </div>

            <div class="messages" id="messages">
                <div class="empty-state">Select a room to start chatting</div>
            </div>

            <div class="typing-indicator" id="typingIndicator"></div>
            <!-- Add this ABOVE the .input-area div -->
                <div class="reply-preview" id="replyPreview" style="display:none;">
                    <div class="reply-content">
                        Replying to <strong id="replyAuthor"></strong>: <span id="replyText"></span>
                    </div>
                <span class="reply-close" onclick="cancelReply()">✕</span>
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type a message..." disabled>
                <button class="btn btn-primary" id="sendBtn" disabled>Send</button>
            </div>
        </main>
    </div>

    <!-- Create Room Modal -->
    <div class="modal" id="createRoomModal" style="display:none;">
        <div class="modal-content">
            <h3>Create New Room</h3>
            <form id="createRoomForm">
                <div class="form-group">
                    <label for="roomName">Room Name</label>
                    <input type="text" id="roomName" placeholder="Enter room name" required>
                </div>
                <div class="form-group">
                    <label for="roomType">Room Type</label>
                    <select id="roomType">
                        <option value="group">Group</option>
                        <option value="direct">Direct</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="participantsInput">Participant IDs</label>
                    <input type="text" id="participantsInput" placeholder="user_id1, user_id2">
                    <small>Enter comma-separated user IDs</small>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="ChatApp.closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/socket.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
